[monitor]
# Monitor side, statistics are from the perspective of this side
# Type: integer, range [0, 1]
# 0 represents the blue camp, 1 represents the red camp
# 监控上报的阵营，类型整型，取值范围[0,1]
# 0表示蓝方阵营，1表示红方阵营
monitor_side = 0  

# Auto switch monitor side, Type: boolean, value range: [true, false]
# 是否启用自动换边逻辑，类型布尔值，true表示开启，false表示关闭
auto_switch_monitor_side = true

[episode]
# Opponent agent, Type: string, range [selfplay, common_ai, custom model id]
# 1. selfplay: Indicates self-play
# 2. common_ai: Indicates playing against a rule-based common AI
# 3. custom_model_id: Indicates playing against a custom model specified by its model ID
# 对手智能体，类型字符串，取值范围[selfplay, common_ai, 自定义模型id]
# 1. selfplay：自对弈
# 2. common_ai：与基于规则的common_ai对战
# 3. 自定义的模型id：与指定的模型对战，需要先将模型上传至模型管理，并且将模型ID配置在kaiwu.json中，然后在此处进行引用
opponent_agent = "selfplay"

# Evaluation interval (unit: games). Type: integer, value range: integer >= 2, default: 10
# 评估间隔(单位局)，类型整型，取值范围为大于等于2的整数，默认值10
eval_interval = 10

# Evaluation opponent type, Type: string, value range: [selfplay, common_ai, custom model ID]
# Please refer to the opponent agent annotation for the meaning of the value
# 评估对手类型，类型字符串，取值范围为[selfplay, common_ai, 自定义模型id]
# 值的含义请参考opponent_agent注释
eval_opponent_type = "common_ai"

# Training-only opponent mixture. Evaluation still follows eval_opponent_type.
# 训练局专用对手混合；评估局仍使用 eval_opponent_type。
# selfplay: use this task's own model history ("random" checkpoint when training)
# common_ai: use built-in rule AI
# model_pool: randomly choose one model id from kaiwu.json.model_pool; skipped if empty
# 权重只看相对比例；例如 0.5/0.3/0.2 表示约 50%/30%/20%。
[episode.train_opponent_mix]
enable = true
dynamic = true
selfplay = 0.5
common_ai = 0.5
model_pool = 0.0
common_ai_low_win_rate = 0.05
common_ai_high_win_rate = 0.25
low_win_selfplay = 0.4
low_win_common_ai = 0.6
mid_win_selfplay = 0.35
mid_win_common_ai = 0.65
high_win_selfplay = 0.5
high_win_common_ai = 0.5

# Blue camp lineup configuration
# 蓝方阵容配置
[[lineups.blue_camp]]
# hero_id, Type: integer, options: 112: Luban No.7, 133: Di Renjie, 199: Arli
# 英雄ID, 类型整数, 可选 112: 鲁班七号, 133: 狄仁杰, 199: 公孙离
hero_id = 112
[[lineups.blue_camp]]
hero_id = 133
[[lineups.blue_camp]]
hero_id = 199

# Red camp lineup configuration
# 红方阵容配置
[[lineups.red_camp]]
# hero_id, Type: integer, options: 112: Luban No.7, 133: Di Renjie, 199: Arli
# 英雄ID, 类型整数, 可选 112: 鲁班七号, 133: 狄仁杰, 199: 公孙离
hero_id = 112
[[lineups.red_camp]]
hero_id = 133
[[lineups.red_camp]]
hero_id = 199
